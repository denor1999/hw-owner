plugins {
    id 'java'
}

group = 'com.denor1999'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.junit:junit-bom:6.1.3')
    testImplementation (
            'org.junit.jupiter:junit-jupiter:6.1.3',
            'org.seleniumhq.selenium:selenium-java:4.51.0',
            'io.github.bonigarcia:webdrivermanager:6.3.3',
            'org.aeonbits.owner:owner:1.0.12',
            'org.assertj:assertj-core:3.27.7'
    )
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperties(System.getProperties())
}